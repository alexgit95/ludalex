# Production : Docker, PostgreSQL, HTTPS terminé par Cloudflare, Cloudflare Access obligatoire
ludalex.acces.mode=cloudflare
ludalex.acces.team-domain=${CF_ACCESS_TEAM_DOMAIN:}
ludalex.acces.audience=${CF_ACCESS_AUD:}

# Variables sans valeur par défaut : le démarrage échoue en nommant la variable absente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
