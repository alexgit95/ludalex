spring.application.name=ludalex
spring.profiles.default=dev

server.port=8181
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Images : volume des fichiers uploadés (en Docker : /data/images via LUDALEX_IMAGES_REPERTOIRE)
ludalex.images.repertoire=./data/images
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# Aucun utilisateur local : l'accès est géré par Cloudflare Access (prod) ou libre (dev)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
