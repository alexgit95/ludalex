<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Joueur', ~{::main})}">
<body>
<main class="contenu">
    <h1 th:text="${joueur == null} ? 'Nouveau joueur' : 'Modifier le joueur'">Joueur</h1>

    <form method="post" enctype="multipart/form-data" th:action="${action}" th:object="${form}" class="formulaire">
        <label>Nom
            <input type="text" th:field="*{nom}" maxlength="100" required>
        </label>
        <p class="erreur" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>

        <div th:with="image=${joueur != null} ? ${joueur.avatar} : null">
            <h2>Avatar</h2>
            <div th:replace="~{fragments/image :: saisie('avatar', ${image})}"></div>
            <p class="erreur" th:if="${#fields.hasErrors('avatarUrl')}" th:errors="*{avatarUrl}"></p>
            <label th:if="${image != null}"><input type="checkbox" name="avatarRetirer" value="true"> Retirer l'avatar</label>
        </div>

        <div th:with="image=${joueur != null} ? ${joueur.imageVictoire} : null">
            <h2>Image de victoire</h2>
            <div th:replace="~{fragments/image :: saisie('victoire', ${image})}"></div>
            <p class="erreur" th:if="${#fields.hasErrors('victoireUrl')}" th:errors="*{victoireUrl}"></p>
            <label th:if="${image != null}"><input type="checkbox" name="victoireRetirer" value="true"> Retirer l'image de victoire</label>
        </div>

        <p>
            <button type="submit">Enregistrer</button>
            <a th:href="@{/admin/joueurs}">Annuler</a>
        </p>
    </form>
</main>
</body>
</html>
