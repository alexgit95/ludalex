<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<!--
  Pages publiques du lien de fin de partie : aucune ressource externe ni lien vers le reste de l'application
  (les fichiers statiques exigent l'accès Cloudflare), d'où les styles intégrés.
-->
<head th:fragment="tete(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title th:text="${titre} + ' - LUDALEX'">LUDALEX</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; background: #fbf6ea; color: #2b2118; }
        main { max-width: 32rem; margin: 0 auto; padding: 1rem; }
        h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 1.5rem; }
        section { background: #fffdf7; border: 1px solid #d6c8a6; border-top: 3px solid #a8873f; border-radius: 0.6rem; padding: 0.75rem 1rem; margin: 1rem 0; }
        fieldset { border: 1px solid #d6c8a6; border-radius: 0.5rem; margin: 0.75rem 0; display: grid; gap: 0.5rem; }
        label { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        input[type="number"], select { padding: 0.4rem; max-width: 8rem; }
        button { width: 100%; padding: 0.7rem; border: 0; border-radius: 0.5rem; background: #3f5e37; color: #fbf6ea; font-size: 1rem; }
        .erreur { color: #8c2f2f; font-weight: 600; }
    </style>
</head>
<body></body>
</html>
