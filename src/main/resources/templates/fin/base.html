<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<!--
  Pages publiques du lien de fin de partie : aucune ressource externe ni lien vers le reste de l'application
  (les fichiers statiques exigent l'accès Cloudflare), d'où les styles intégrés.
-->
<head th:fragment="tete(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title th:text="${titre} + ' - LUDALEX'">LUDALEX</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f1faee; color: #2f3e46; }
        main { max-width: 32rem; margin: 0 auto; padding: 1rem; }
        h1 { font-size: 1.5rem; }
        section { background: #fff; border: 1px solid #cad2c5; border-radius: 0.6rem; padding: 0.75rem 1rem; margin: 1rem 0; }
        fieldset { border: 1px solid #cad2c5; border-radius: 0.5rem; margin: 0.75rem 0; display: grid; gap: 0.5rem; }
        label { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        input[type="number"], select { padding: 0.4rem; max-width: 8rem; }
        button { width: 100%; padding: 0.7rem; border: 0; border-radius: 0.5rem; background: #52796f; color: #fff; font-size: 1rem; }
        .erreur { color: #9b2226; font-weight: 600; }
    </style>
</head>
<body></body>
</html>
