<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>
<div th:fragment="confirmation" class="confirmation">
    <p>
        Supprimer la partie de <strong th:text="${partie.jeu.nom}">jeu</strong> du
        <span th:text="${#temporals.format(partie.datePartie, 'dd/MM/yyyy')}">01/01/2026</span> ?
        Ses scores et ses équipes seront supprimés.
    </p>
    <form method="post" th:action="@{/parties/{id}/supprimer(id=${partie.id})}">
        <button type="submit">Confirmer la suppression</button>
        <button type="button" onclick="this.closest('.confirmation').remove()">Annuler</button>
    </form>
</div>
</body>
</html>
